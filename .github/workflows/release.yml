name: Build and Create Release Asset

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Updated from 20 to satisfy Node >= 22.13.0
          cache: 'yarn'

      - name: Install dependencies & Compile Assets
        run: |
          yarn install --frozen-lockfile --ignore-engines
          yarn build

      - name: Bundle Production Plugin ZIP
        run: |
          # 1. Clean up any previous package folder and build the directory tree
          rm -rf package
          mkdir -p package/iamlars-plugin/src/blocks

          # 2. Copy the contents of src/blocks directly into package/iamlars-plugin/src/blocks/
          cp -r src/blocks/* package/iamlars-plugin/src/blocks/

          # 3. Copy other required runtime files
          cp -r dist package/iamlars-plugin/
          cp -r vendor package/iamlars-plugin/
          cp iamlars-plugin.php package/iamlars-plugin/

          # 4. Zip the plugin folder
          cd package
          zip -r ../iamlars-plugin.zip iamlars-plugin/
          cd ..

      - name: Create GitHub Release with Asset
        uses: softprops/action-gh-release@v2
        with:
          files: iamlars-plugin.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}