name: Build and Create Release Asset

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Updated from 20 to satisfy Node >= 22.13.0
          cache: 'yarn'

      - name: Install dependencies & Compile Assets
        run: |
          yarn install --frozen-lockfile --ignore-engines
          yarn build

      - name: Bundle Production Plugin ZIP
        run: |
          mkdir -p package/iamlars-plugin

          # Copy only required runtime files
          cp -r dist package/iamlars-plugin/
          cp -r src/blocks package/iamlars-plugin/src/
          cp -r vendor package/iamlars-plugin/
          cp iamlars-plugin.php package/iamlars-plugin/

          # Zip the plugin folder
          cd package
          zip -r ../iamlars-plugin.zip iamlars-plugin/
          cd ..

      - name: Create GitHub Release with Asset
        uses: softprops/action-gh-release@v2
        with:
          files: iamlars-plugin.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}